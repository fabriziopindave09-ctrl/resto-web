<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resto: gestión gastronómica</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resto">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f5f9;--sf:#fff;--sf2:#f6f8fb;--tx:#0f1b2a;--mt:#566577;--bd:#dce3ec;--ac:#0f766e;--acx:#fff;--acs:#dff3f1;--ok:#0f7b4f;--oks:#e1f4ea;--wa:#9a5200;--was:#fdf0dc;--dn:#b42318;--rs:#6a3dc0;--rss:#ece6fa;--sh:0 1px 2px rgba(15,27,42,.06),0 6px 18px rgba(15,27,42,.06);--r:14px;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1118;--sf:#131c26;--sf2:#182430;--tx:#e7edf3;--mt:#93a4b5;--bd:#243240;--ac:#2dd4bf;--acx:#04201c;--acs:#0f2e2b;--ok:#34d399;--oks:#0f2a20;--wa:#fbbf24;--was:#2e2410;--dn:#f87171;--rs:#b79cff;--rss:#241c3a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0b1118;--sf:#131c26;--sf2:#182430;--tx:#e7edf3;--mt:#93a4b5;--bd:#243240;--ac:#2dd4bf;--acx:#04201c;--acs:#0f2e2b;--ok:#34d399;--oks:#0f2a20;--wa:#fbbf24;--was:#2e2410;--dn:#f87171;--rs:#b79cff;--rss:#241c3a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:0 14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;transition:background .15s,border-color .15s,transform .05s}
button:hover:not(:disabled){background:var(--sf2);border-color:var(--mt)}
button:active:not(:disabled){transform:scale(.98)}
input,select{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:0 12px;min-height:44px;min-width:0;width:140px}
select{width:auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.on,.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.on:hover:not(:disabled),.pri:hover:not(:disabled){background:var(--ac);filter:brightness(1.08);border-color:var(--ac)}
.ghost{background:transparent}
.dng{color:var(--dn)}
.ib{padding:0;width:44px}
/* header + nav */
.hd{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ac);color:var(--acx);display:grid;place-items:center}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{border:0;background:transparent;color:var(--mt);position:relative;border-radius:10px}
.nav button:hover:not(:disabled){background:var(--sf2)}
.nav button.on{background:var(--acs);color:var(--ac)}
.badge{position:absolute;top:2px;right:2px;min-width:20px;height:20px;border-radius:99px;background:var(--wa);color:var(--sf);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.sp{margin-left:auto}
.hr{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;min-height:32px}
.chip.off{background:var(--was);color:var(--wa)}
.who{background:var(--sf2);border:1px solid var(--bd)}
.who small{color:var(--mt);font-weight:500}
main{padding:18px 16px 32px;max-width:1120px;margin:auto}
h2,h3{margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:22px}h3{font-size:17px;display:flex;align-items:center;gap:8px}
.mt{color:var(--mt)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}.split>*{min-width:0}
@media(min-width:900px){.split{grid-template-columns:minmax(0,1fr) 360px}.aside{position:sticky;top:84px}}
.chips,.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips{margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips button{flex:none;min-height:38px;border-radius:99px}
.hint{font-size:13px;color:var(--mt)}
/* tables */
.tbl{--st:var(--ok);flex-direction:column;align-items:stretch;justify-content:space-between;gap:10px;min-height:118px;padding:12px 14px;text-align:left;border-radius:var(--r);border-left:6px solid var(--st);box-shadow:var(--sh);font-weight:500}
.tbl .tn{font-size:36px;font-weight:700;line-height:1}
.tbl .row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tbl .det{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.busy{--st:var(--ac)}.tbl.resv{--st:var(--rs)}
.tbl.rdy{--st:var(--ok);background:var(--oks);animation:p 1.8s ease-in-out infinite}
.tbl.add{border:2px dashed var(--bd);border-left:2px dashed var(--bd);box-shadow:none;background:transparent;color:var(--mt);align-items:center;justify-content:center}
@keyframes p{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--st);background:color-mix(in srgb,var(--st) 14%,var(--sf));padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill .ic{width:14px;height:14px}
.tbl.rdy .pill{background:var(--sf)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--rss);color:var(--rs);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.banner button{margin-left:auto;min-height:36px}
/* products */
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--mt)}
.search input{width:100%;padding-left:40px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;text-align:left;min-height:96px;padding:12px;font-weight:600;border-radius:12px}
.prod small{color:var(--mt);font-size:12px;line-height:1.25;font-weight:400}
.prod b{margin-top:auto;color:var(--ac);font-size:16px}
.num{color:var(--mt);font-size:12px;font-weight:500}
/* lines */
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.ln:last-child{border-bottom:0}
.ln small{display:block;color:var(--mt);font-weight:500}
.ln .s-sent{color:var(--wa)}.ln .s-ready{color:var(--ok);font-weight:700}
.ln .acts button{min-height:40px;width:40px;padding:0}
.ln .acts button.pri{width:auto;padding:0 12px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:26px;font-weight:700;margin:10px 0}
.tot span{font-size:15px;font-weight:600;color:var(--mt)}
.sep{border-top:1px dashed var(--bd);margin:14px 0}
.lbl{font-size:13px;font-weight:600;color:var(--mt);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.stp{display:flex;align-items:center;gap:10px}
.stp b{min-width:28px;text-align:center;font-size:20px}
.stp button{width:44px;padding:0}
.paym{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share{background:var(--acs);color:var(--ac);border-radius:12px;padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;margin:10px 0}
.paid{font-size:14px;color:var(--ok);font-weight:600}
.big{width:100%;min-height:50px;font-size:17px}
/* reports */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi h2{margin:0;font-size:26px}
.top{display:flex;align-items:center;gap:10px;margin:8px 0}
.top span{flex:0 0 40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top i{display:block;height:10px;background:var(--ac);border-radius:5px}
.kit .late{color:var(--wa);font-weight:700}
/* forms */
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mt)}
.rtag{width:44px;height:44px;border-radius:12px;background:var(--rss);color:var(--rs);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.ln .who2{display:flex;align-items:center;gap:12px}
.ok-t{color:var(--ok)}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}
.lgc{width:100%;max-width:420px}
.lgc .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 12px}
.urow{width:100%;justify-content:flex-start;min-height:56px;margin-bottom:8px;text-align:left}
.urow small{color:var(--mt);font-weight:500;display:block}
.urow.on small{color:inherit;opacity:.85}
.err{color:var(--dn);font-weight:600;margin:8px 0 0}
/* receipt */
.done{text-align:center;max-width:460px;margin:30px auto}
.done .ok-i{width:64px;height:64px;border-radius:50%;background:var(--oks);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.done .ok-i .ic{width:34px;height:34px}
/* mobile */
@media(max-width:760px){
 .nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
 .nav button{flex:1;flex-direction:column;gap:2px;font-size:12px;min-height:54px;padding:4px}
 .badge{right:calc(50% - 26px)}
 main{padding-bottom:100px}
 .who .nm,.brand .bn{display:none}
 .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}.toast.show{opacity:1}
/* print (thermal 80mm) */
#prt{display:none}
@media print{
 @page{size:80mm auto;margin:0}
 html,body{background:#fff!important;color:#000!important}
 body>*:not(#prt){display:none!important}
 #prt{display:block;width:72mm;margin:0 auto;padding:4mm 0 8mm;font:12px/1.35 'Courier New',ui-monospace,monospace;color:#000}
 #prt .t-c{text-align:center}#prt .t-b{font-weight:700}#prt .t-lg{font-size:15px}#prt .t-xl{font-size:26px;font-weight:700;text-align:center;margin:4px 0}
 #prt .t-hr{border-top:1px dashed #000;margin:6px 0}
 #prt .t-row{display:flex;justify-content:space-between;gap:8px}
 #prt .t-row span:first-child{flex:1;word-break:break-word}
 #prt .t-it{font-size:16px;font-weight:700;margin:4px 0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="prt" aria-hidden="true"></div>
<script src="core.js"></script>
<script>
const KEY='resto.v2',SK='resto.sess';
const M=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- iconos (trazo, estilo lineal) ---------- */
const ICONS={
plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
printer:'<path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
flame:'<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 2.9-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 4 2.6 4 6"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',
card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/>',
bank:'<path d="M3 10 12 4l9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 21h18"/>',
sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
wifioff:'<path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8a15 15 0 0 0-8-3.7M5 12.9a10 10 0 0 1 3.5-2M19 12.9a10 10 0 0 0-2-1.5M12 20h.01"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/>',
utensils:'<path d="M5 3v8a2 2 0 0 0 2 2v8M9 3v8M7 3v18M17 21V3c-2.5 1.5-3 5-3 8h3"/>',
lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
receipt:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/>',
download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
back:'<path d="M15 18 9 12l6-6"/>',
heart:'<path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 21.8l8.8-8.8a5.2 5.2 0 0 0 0-7.4z"/>'
};
const I=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- datos ---------- */
const Core=window.Core,ROLES=Core.ROLES,TK='resto.tok';
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}return null};
let VER=0,NET=false,NAME='Resto',DFLT=false,TOKEN=ss(TK),SESS=ss(SK),SKEW=0,PUB=[],CONN=true,ES=null,IP=null,S;
const pad2=n=>String(n).padStart(2,'0'),dstr=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())},dback=n=>dstr(Date.now()-n*864e5);
let V={tab:'salon',table:null,cat:'Birras',rs:0,q:'',lu:null,err:'',rc:null,h:{from:dback(6),to:dstr(),rows:null,busy:false}};
const now=()=>Date.now()+SKEW;
const stub=()=>{S={seq:0,tables:[],orders:[],res:[],menu:[],users:PUB,cfg:{name:NAME,addr:'',tip:10,auto:false}}};
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.menu)S=Core.demo();Core.fix(S)}
function save(){if(NET)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cur=()=>S.users.find(u=>String(u.id)===String(SESS));
const open=t=>Core.open(S,t),resv=t=>Core.resv(S,t),tot=Core.tot,locked=Core.locked,calc=o=>Core.calc(S,o);
const nm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function list(){const q=nm(V.q).trim().replace(/^#\s*/,'');return q?S.menu.filter(p=>/^\d+$/.test(q)?p.id===+q:nm(p.name+' '+(p.d||'')).includes(q)):S.menu.filter(p=>V.cat==='Todos'||p.cat===V.cat)}
const prods=()=>list().map(p=>`<button class="prod" data-a="add" data-v="${p.id}"><span class="num">#${p.id}</span><span>${E(p.name)}</span>${p.d?`<small>${E(p.d)}</small>`:''}<b>${M(p.price)}</b></button>`).join('')||'<p class="mt">No hay productos con esa búsqueda.</p>';
const ST={new:'Sin enviar',sent:'En cocina',ready:'Listo para servir',served:'Servido'};
const MZ=['admin','mozo'],AD=['admin'];
const TABS=[['salon','Salón','grid',['admin','mozo']],['cocina','Cocina','flame',['admin','cocina']],['reservas','Reservas','cal',['admin','mozo']],['carta','Carta','book',['admin']],['reportes','Reportes','chart',['admin']],['historial','Historial','clock',['admin']],['ajustes','Ajustes','sliders',['admin']]];
const VACT={table:MZ,pcom:MZ,ppre:MZ,pticket:MZ,closerc:MZ,resseat:MZ,hbuscar:AD,hcsv:AD};
const can=a=>{const r=Core.ACT[a]||VACT[a],u=cur();return !r||(u&&r.includes(u.role))};
let TT;function toast(m){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=m;e.className='toast show';clearTimeout(TT);TT=setTimeout(()=>e.className='toast',3500)}

/* ---------- impresión térmica ---------- */
function printHTML(h){const p=document.getElementById('prt');p.innerHTML=h;setTimeout(()=>window.print(),60)}
addEventListener('afterprint',()=>{const p=document.getElementById('prt');if(p)p.innerHTML=''});
const trow=(a,b,c='')=>`<div class="t-row ${c}"><span>${a}</span><span>${b}</span></div>`;
const dt=d=>new Date(d).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});
function head(t){const c=S.cfg;return `<div class="t-c t-b t-lg">${E(c.name)}</div>${c.addr?`<div class="t-c">${E(c.addr)}</div>`:''}<div class="t-c t-b">${t}</div><div class="t-hr"></div>`}
function comandaHTML(o){const u=cur(),its=o.items.filter(i=>i.b&&i.b===o.lb);

/* ---------- red (modo servidor) ---------- */
async function api(path,body){
 const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});
 if(r.status===401&&TOKEN){doLogout();toast('La sesión venció. Volvé a ingresar.');throw new Error('401')}
 const j=await r.json().catch(()=>({}));if(!r.ok&&!j.err)j.err='Error '+r.status;return j}
const accept=j=>{if(!j.state)return false;if(j.v!=null){if(j.v<VER)return true;VER=j.v}S=j.state;SKEW=j.now-Date.now();CONN=true;return true};
async function pull(){try{const j=await api('/api/state');if(accept(j)){render(true);return true}}catch(e){if(e.message!=='401'){CONN=false;render(true)}}return false}
function connect(){if(ES)ES.close();ES=new EventSource('/api/events?t='+encodeURIComponent(TOKEN));ES.onmessage=()=>pull();ES.onopen=()=>{pull()};ES.onerror=()=>{if(CONN){CONN=false;render(true)}}}
async function loadPub(){try{const j=await api('/api/users');PUB=j.users||[];DFLT=!!j.dflt}catch(e){PUB=[]}}
async function dispatch(a,p){
 if(!NET){const r=Core.apply(S,a,p,cur());if(!r.err)save();return r}
 try{const j=await api('/api/act',{a,p});accept(j);return j.result||{err:j.err}}
 catch(e){if(e.message!=='401')toast('No se pudo conectar con el servidor. Revisá el WiFi.');return{err:'net'}}}

async function run(a,v){
 if(!can(a))return;
 if(a==='login')return doLogin();
 if(a==='logout')return doLogout();
 if(a==='hbuscar')return hsearch();
 if(a==='hcsv')return hcsv();
 if(VIEW[a]){if(a!=='reset')V.rs=0;VIEW[a](v);render();return}
 if(a==='reset'&&!V.rs){V.rs=1;render();return}
 V.rs=0;
 const r=await dispatch(a,DATA[a]?DATA[a](v):{});
 if(r.err&&r.err!=='net')toast(r.err);
 if(a==='pay'&&r.rc){V.rc=r.rc;V.table=null}
 if(a==='send'&&r.lb&&S.cfg.auto)printComanda(open(V.table));
 render()}
async function doLogin(){
 const el=document.getElementById('pin'),u=S.users.find(x=>x.id===V.lu);if(!el||!u)return;
 if(!NET){if(el.value===String(u.pin)){SESS=String(u.id);ss(SK,SESS);V.lu=null;V.err='';V.tab=TABS.find(t=>t[3].includes(u.role))[0]}else V.err='PIN incorrecto';render();return}
 const j=await api('/api/login',{id:u.id,pin:el.value}).catch(()=>({err:'No se pudo conectar con el servidor'}));
 if(j.token){TOKEN=j.token;ss(TK,TOKEN);SESS=String(j.user.id);ss(SK,SESS);V.lu=null;V.err='';V.table=null;V.rc=null;V.tab=TABS.find(t=>t[3].includes(j.user.role))[0];await pull();connect()}
 else V.err=j.err||'PIN incorrecto';
 render()}

 const t=TOKEN;if(ES){ES.close();ES=null}SESS=null;TOKEN=null;ss(SK,null);ss(TK,null);V.lu=null;V.table=null;V.rc=null;V.err='';
 VER=0;if(NET){if(t)fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+t}}).catch(()=>{});await loadPub();stub()}
 render()}

 <label class="acts" style="margin-top:12px;min-height:44px"><input type="checkbox" data-cfg="auto" ${S.cfg.auto?'checked':''} style="width:22px;min-height:22px"> Imprimir la comanda automáticamente al enviar a cocina</label>
 <p class="hint">Para impresoras térmicas: elegí la impresora de 80 mm en el diálogo de impresión y desactivá encabezados y pies de página.</p></div>
 <div class="card"><h3>${I('users')}Usuarios y roles</h3>${S.users.map(u=>`<div class="ln" style="flex-wrap:wrap"><div class="acts"><input data-u="name" data-id="${u.id}" value="${E(u.name)}" aria-label="Nombre de usuario" style="width:150px"><select data-u="role" data-id="${u.id}" aria-label="Rol de ${E(u.name)}">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select><input data-u="pin" data-id="${u.id}" value="${E(u.pin)}" inputmode="numeric" maxlength="8" aria-label="PIN de ${E(u.name)}" style="width:100px"></div>${u.id===me.id?'<span class="hint">Tu usuario</span>':`<button class="dng ib" data-a="userdel" data-v="${u.id}" aria-label="Eliminar ${E(u.name)}">${I('trash')}</button>`}</div>`).join('')}
 <div class="sep"></div><div class="form"><label>Nuevo usuario<input id="nu-n" placeholder="Nombre" style="width:160px"></label><label>Rol<select id="nu-r">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>PIN (4 a 8 números)<input id="nu-p" inputmode="numeric" maxlength="8" placeholder="0000" style="width:100px"></label><button class="pri" data-a="useradd">${I('plus')}Agregar</button></div>
 <p class="hint">Mozo: salón y reservas. Cocina: solo la pantalla de cocina. Administrador: todo, incluido carta, reportes y ajustes.</p></div>`}
function login(){
 const u=S.users.find(x=>x.id===V.lu),dflt=NET?DFLT:S.users.some(x=>x.role==='admin'&&x.pin==='1234');
 if(!S.users.length)return `<div class="lg"><div class="card lgc"><div class="logo">${I('wifioff')}</div><h2 style="text-align:center">Sin conexión con el servidor</h2><p class="mt" style="text-align:center">Revisá que la PC del local esté encendida con Resto abierto y que este equipo esté en el mismo WiFi.</p><button class="pri big" data-a="retry">Reintentar</button></div></div>`;
 return `<div class="lg"><div class="card lgc"><div class="logo">${I('utensils')}</div><h2 style="text-align:center">${E(S.cfg.name)}</h2><p class="mt" style="text-align:center;margin-top:0">${u?'Ingresá tu PIN':'¿Quién va a trabajar?'}</p>
 ${u?`<div class="urow card" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;box-shadow:none">${I('user')}<div><b>${E(u.name)}</b><small class="mt" style="display:block">${ROLES[u.role]}</small></div></div><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" aria-label="PIN" style="width:100%;font-size:22px;text-align:center;letter-spacing:.3em">${V.err?`<p class="err" role="alert">${V.err}</p>`:''}<div class="acts" style="margin-top:12px"><button data-a="unpick">${I('back')}Cambiar</button><button class="pri" data-a="login" style="flex:1">${I('lock')}Entrar</button></div>`
 :S.users.map(x=>`<button class="urow" data-a="pick" data-v="${x.id}">${I(x.role==='cocina'?'flame':x.role==='admin'?'sliders':'user')}<span><b>${E(x.name)}</b><small>${ROLES[x.role]}</small></span></button>`).join('')}
 ${dflt&&!u?'<p class="hint" style="text-align:center">PIN inicial: Admin 1234 · Mozo 0000 · Cocina 1111. Cambialos en Ajustes.</p>':''}</div></div>`}
function historial(){
 const h=V.h,rows=h.rows;
 let out=`<div class="card"><h3>${I('clock')}Historial de ventas</h3><div class="form"><label>Desde<input type="date" data-h="from" value="${h.from}" style="width:160px"></label><label>Hasta<input type="date" data-h="to" value="${h.to}" style="width:160px"></label><button class="pri" data-a="hbuscar" ${h.busy?'disabled':''}>${I('search')}Buscar</button>${rows&&rows.length?`<button data-a="hcsv">${I('download')}Exportar CSV</button>`:''}</div>${NET?'':'<p class="hint">Modo local: solo se ven las ventas guardadas en este navegador.</p>'}</div>`;
 if(!rows)return out+'<p class="mt" style="margin-top:14px">Elegí un rango de fechas y tocá Buscar.</p>';
 if(!rows.length)return out+'<div class="card"><p class="mt">No hay ventas en ese rango.</p></div>';
 const sum=rows.reduce((a,o)=>a+o.sub,0),tips=rows.reduce((a,o)=>a+o.tipAmt,0);
 out+=`<div class="kpis" style="margin-top:14px"><div class="card kpi"><span class="mt">Pedidos</span><h2>${rows.length}</h2></div><div class="card kpi"><span class="mt">Ventas</span><h2>${M(sum)}</h2></div><div class="card kpi"><span class="mt">Propinas</span><h2>${M(tips)}</h2></div><div class="card kpi"><span class="mt">Total cobrado</span><h2>${M(sum+tips)}</h2></div></div>`;
 return out+`<div class="card">${rows.slice(0,300).map(o=>`<div class="ln"><div class="who2"><span class="rtag">${o.table}</span><div><b>${M(o.total)}</b> <span class="mt">· ${E(o.method)}</span><small>${dt(o.paidAt)}${o.mozo?' · '+E(o.mozo):''}</small><small>${o.items.map(i=>i.qty+'× '+E(i.name)).join(', ')}</small></div></div></div>`).join('')}${rows.length>300?`<p class="hint">Se muestran los primeros 300. El CSV incluye todos.</p>`:''}</div>`}
function draw(){
 const U=cur(),app=document.getElementById('app');
 if(!U){app.innerHTML=login();if(V.lu){const p=document.getElementById('pin');if(p)p.focus()}return}
 const tabs=TABS.filter(t=>t[3].includes(U.role));if(!tabs.some(t=>t[0]===V.tab)){V.tab=tabs[0][0];V.table=null}
 const pend=S.orders.flatMap(o=>o.status==='open'?o.items:[]).filter(i=>i.s==='sent').length,views={salon,cocina,reservas,carta,reportes,historial,ajustes};
 const off=NET?(!CONN?'Sin conexión con el servidor':''):(navigator.onLine===false?'Sin conexión':'');
 app.innerHTML=`<header class="hd"><div class="brand"><span class="logo">${I('utensils')}</span><span class="bn">${E(S.cfg.name)}</span></div>
 <nav class="nav" aria-label="Secciones">${tabs.map(([k,l,ic])=>`<button class="${V.tab===k?'on':''}" data-a="tab" data-v="${k}" ${V.tab===k?'aria-current="page"':''}>${I(ic)}<span>${l}</span>${k==='cocina'&&pend?`<span class="badge" aria-label="${pend} pendientes">${pend}</span>`:''}</button>`).join('')}</nav>
 <div class="hr sp">${off?`<span class="chip off" role="status">${I('wifioff')}${off}</span>`:''}${IP?`<button data-a="install" style="min-height:36px">${I('download')}Instalar</button>`:''}<span class="chip who">${I('user')}<span class="nm"><b>${E(U.name)}</b>${nm(U.name)===nm(ROLES[U.role])?'':` <small>${ROLES[U.role]}</small>`}</span></span><button class="ib ghost" data-a="logout" aria-label="Cerrar sesión" title="Cerrar sesión">${I('logout')}</button></div></header><main>${views[V.tab]()}</main>`}
function render(keep){
 let snap=null,fid=null,fs=0;
 if(keep){snap={};document.querySelectorAll('#app input[id],#app select[id]').forEach(e=>snap[e.id]=e.value);const a=document.activeElement;if(a&&a.id&&a.closest&&a.closest('#app')){fid=a.id;try{fs=a.selectionStart}catch(_){}}}
 draw();
 if(keep){for(const id in snap){const e=document.getElementById(id);if(!e||id==='q')continue;if(e.tagName==='SELECT'&&![...e.options].some(o=>o.value===snap[id]))continue;e.value=snap[id]}
  if(fid){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(fs,fs)}catch(_){}}}}}
async function boot(){
 load();
 if(/^https?:/.test(location.protocol)){try{const r=await fetch('/api/ping',{cache:'no-store'});const j=await r.json();if(j&&j.resto){NET=true;NAME=j.name||NAME}}catch(e){}}
 if(NET){let ok=false;
  if(TOKEN&&SESS){stub();ok=await pull();if(ok)connect()}
  if(!ok){TOKEN=null;SESS=null;ss(TK,null);ss(SK,null);await loadPub();stub()}}
 render();
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
